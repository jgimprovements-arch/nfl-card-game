<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFL Card Packs</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Oswald','Arial Narrow',sans-serif}
body{background:#000308;color:#F1F5F9}
button{cursor:pointer}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#FFB80044;border-radius:2px}
@keyframes cFlip{from{opacity:0;transform:rotateY(90deg) scale(.8)}to{opacity:1;transform:rotateY(0)}}
@keyframes shimmer{0%{background-position:-300% center}100%{background-position:300% center}}
@keyframes gMyth{0%,100%{box-shadow:0 0 22px 5px #e879f9,0 0 55px 10px #a855f755}50%{box-shadow:0 0 34px 9px #f0abfc,0 0 75px 18px #a855f788}}
@keyframes gLeg{0%,100%{box-shadow:0 0 16px 4px #FFB800}50%{box-shadow:0 0 28px 7px #FFB800}}
@keyframes gUltra{0%,100%{box-shadow:0 0 14px 3px #4ade80}50%{box-shadow:0 0 24px 6px #86efac}}
@keyframes gEpic{0%,100%{box-shadow:0 0 12px 3px #A855F7}50%{box-shadow:0 0 22px 6px #C084FC}}
@keyframes gRare{0%,100%{box-shadow:0 0 7px 2px #3B82F6}50%{box-shadow:0 0 14px 4px #60A5FA}}
@keyframes bPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.1)}}
@keyframes rainbow{0%{filter:hue-rotate(0)}100%{filter:hue-rotate(360deg)}}
@keyframes tGlow{0%,100%{text-shadow:0 0 20px #FFB80066}50%{text-shadow:0 0 36px #FFB800aa}}
@keyframes gridPulse{0%,100%{opacity:.04}
