<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kashton's Gridiron</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Anton&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Oswald','Arial Narrow',sans-serif}
body{background:#000308;color:#F1F5F9}
button{cursor:pointer}
input,textarea{font-family:inherit}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#FFB80044;border-radius:2px}
@keyframes cFlip{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes shimmer{0%{background-position:-300% center}100%{background-position:300% center}}
@keyframes gM{0%,100%{box-shadow:0 0 22px 5px #e879f9}50%{box-shadow:0 0 34px 9px #f0abfc}}
@keyframes gL{0%,100%{box-shadow:0 0 16px 4px #FFB800}50%{box-shadow:0 0 28px 7px #FFB800}}
@keyframes gU{0%,100%{box-shadow:0 0 14px 3px #4ade80}50%{box-shadow:0 0 24px 6px #86efac}}
@keyframes gE{0%,100%{box-shadow:0 0 12px 3px #A855F7}50%{box-shadow:0 0 22px 6px #C084FC}}
@keyframes gR{0%,100%{box-shadow:0 0 7px 2px #3B82F6}50%{box-shadow:0 0 14px 4px #60A5FA}}
@keyframes bP{0%,100%{filter:brightness(1)}50%{filter:brightness(1.1)}}
@keyframes rb{0%{filter:hue-rotate(0)}100%{filter:hue-rotate(360deg)}}
@keyframes tG{0%,100%{text-shadow:0 0 20px #FFB80066}50%{text-shadow:0 0 36px #FFB800aa}}
@keyframes su{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes tI{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<!-- All game logic lives in game.js (same folder). Edit that file for game changes. -->
<script src="game.js"></script>
</body>
</html>
